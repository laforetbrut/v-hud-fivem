<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>v-hud</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/status.css">
    <link rel="stylesheet" href="css/speedo.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>

<!--
    Three layers, and they are separate on purpose.

    #hud        always mounted, never given pointer events. Everything the player sees while
                playing lives here.
    #layout     the drag editor. Sits over the HUD, takes pointer events, and shows a ghost
                of every element so one can be dragged.
    #menu       the settings panel. Takes focus; the HUD keeps drawing behind it so a change
                is visible the moment it is made.
-->

<div id="hud" class="hud" data-ready="false">

    <!-- Cinematic bars. Transformed rather than resized: a height animation relayouts the
         page on every frame, a transform does not. -->
    <div class="cinebar cinebar--top" id="cine-top"></div>
    <div class="cinebar cinebar--bottom" id="cine-bottom"></div>

    <!-- The minimap border. The map itself is the game's; this is only the frame around it,
         because the native one cannot be recoloured. -->
    <div class="minimap-frame" id="minimap-frame" data-shape="square"></div>

    <div class="hud-el" id="el-status" data-element="status">
        <div class="status" id="status-list"></div>
    </div>

    <div class="hud-el" id="el-speedo" data-element="speedo">
        <div class="speedo" id="speedo"></div>
    </div>

    <div class="hud-el" id="el-compass" data-element="compass">
        <div class="compass" id="compass"></div>
    </div>

    <div class="hud-el" id="el-streets" data-element="streets">
        <div class="streets" id="streets">
            <div class="streets__row">
                <span class="streets__dir" id="street-dir"></span>
                <span class="streets__name" id="street-name"></span>
                <span class="streets__cross" id="street-cross"></span>
            </div>
            <div class="streets__zone" id="street-zone"></div>
        </div>
    </div>

    <div class="hud-el" id="el-money" data-element="money">
        <!-- Both rows start off. Without the explicit data-on the CSS selector for "off" does
             not match on the first frame, and an empty money row is drawn on every spawn. -->
        <div class="money" id="money">
            <div class="money__row money__row--cash" id="money-cash" data-on="false">
                <span class="money__icon">&#9679;</span>
                <span class="money__value" id="money-cash-value">0</span>
            </div>
            <div class="money__row money__row--bank" id="money-bank" data-on="false">
                <span class="money__icon">&#9632;</span>
                <span class="money__value" id="money-bank-value">0</span>
            </div>
            <div class="money__delta" id="money-delta" data-on="false"></div>
        </div>
    </div>

    <div class="hud-el" id="el-voice" data-element="voice">
        <div class="voice" id="voice">
            <svg class="voice__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
            <div class="voice__rings">
                <i class="voice__ring" data-level="1"></i>
                <i class="voice__ring" data-level="2"></i>
                <i class="voice__ring" data-level="3"></i>
            </div>
            <span class="voice__radio" id="voice-radio"></span>
        </div>
    </div>

    <div class="hud-el" id="el-vehicle" data-element="vehicle">
        <div class="vext" id="vehicle-extras"></div>
    </div>

    <div class="toasts" id="toasts"></div>
</div>

<!-- The drag editor -->
<div id="layout" class="layout" hidden>
    <div class="layout__grid" id="layout-grid"></div>
    <div class="layout__bar">
        <span class="layout__hint" id="layout-hint"></span>
        <label class="layout__snap">
            <input type="checkbox" id="layout-snap" checked>
            <span id="layout-snap-label"></span>
        </label>
        <button class="btn btn--ghost" id="layout-reset"></button>
        <button class="btn btn--primary" id="layout-done"></button>
    </div>
</div>

<!-- The settings menu -->
<div id="menu" class="menu" hidden>
    <div class="menu__panel" role="dialog" aria-modal="true">

        <header class="menu__head">
            <div class="menu__title">
                <h1 id="menu-title"></h1>
                <p id="menu-subtitle"></p>
            </div>
            <div class="menu__search">
                <input type="search" id="menu-search" autocomplete="off">
            </div>
            <button class="menu__close" id="menu-close" aria-label="close">&#10005;</button>
        </header>

        <div class="menu__body">
            <nav class="menu__tabs" id="menu-tabs"></nav>
            <div class="menu__content" id="menu-content"></div>
        </div>

        <footer class="menu__foot">
            <span class="menu__meta" id="menu-meta"></span>
            <div class="menu__actions">
                <button class="btn btn--ghost" id="menu-reset"></button>
                <button class="btn btn--primary" id="menu-done"></button>
            </div>
        </footer>

    </div>
</div>

<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/status.js"></script>
<script src="js/speedo.js"></script>
<script src="js/compass.js"></script>
<script src="js/money.js"></script>
<script src="js/layout.js"></script>
<script src="js/menu.js"></script>
<script src="js/app.js"></script>

</body>
</html>
